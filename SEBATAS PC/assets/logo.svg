<?xml version="1.0" encoding="utf-8"?>
<!-- SEBATAS PC logo: isometric cube + text, made as an accessible SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">SEBATAS PC</title>
  <desc id="logoDesc">Logo with a cyan isometric cube icon and SEBATAS PC wordmark in gradient turquoise-blue.</desc>

  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cube icon (isometric) -->
  <g transform="translate(12,12) scale(0.9)">
    <!-- right face -->
    <path d="M64 8 L104 28 L104 68 L64 48 Z" fill="none" stroke="url(#g1)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" />
    <!-- left face -->
    <path d="M24 28 L64 8 L64 48 L24 68 Z" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" />
    <!-- top face -->
    <path d="M24 28 L64 8 L104 28 L64 48 Z" fill="none" stroke="url(#g1)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" />
    <!-- inner edges for depth -->
    <path d="M64 8 L64 48" stroke="#8ff7ff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(140,75)">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="700" font-size="36" fill="url(#g1)">SEBATAS PC</text>
  </g>
</svg>